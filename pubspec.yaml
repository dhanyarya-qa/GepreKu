name: gepreku
description: Ultimate 3D AI Restaurant Ecosystem - High-End Flutter Restaurant App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  cloud_functions: ^4.5.12
  firebase_messaging: ^14.7.9
  
  # 3D Rendering
  model_viewer_plus: ^1.7.0
  rive: ^0.12.4
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  
  # QR & Barcode
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  
  # Payment
  midtrans_sdk: ^0.2.0
  
  # Bluetooth Printer
  esc_pos_bluetooth: ^0.4.1
  esc_pos_utils: ^1.1.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.0
  
  # Cupertino Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/3d_models/
    - assets/animations/
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
